# Options
title: 'Kévin THÉRAGE | Symfony Lead Developer (Expert Symfony 7 Certified)'
baseline: >-
  PHP/Symfony Developer with over 10 years of experience, certified Symfony 6 and 7 Expert. Specialized in
  complex architectures and ambitious technical projects for demanding sectors: banks, public services,
  e-commerce and French press.
description: 'Kévin THÉRAGE – Symfony Lead Developer, Expert Symfony 7 Certified. Technical blog on Symfony, PHP, web development with tutorials, best practices and expert advice for developers.'
url: "https://ktherage.github.io"
baseurl: "https://ktherage.github.io"
canonicalurl: true

# Menus
menus:
  main:
    - id: 'index'
      name: 'Home'
      url: '/'
      weight: 10
    - id: 'blog'
      name: 'Blog'
      url: '/blog/'
      weight: 20
      description: 'Technical articles and tutorials on web development'
    - id: 'tags'
      name: 'Tags'
      url: '/tags/'
      weight: 30

theme: null

author:
  name: 'Kévin THÉRAGE'
  image: 'img/me.png'
  url: 'https://ktherage.github.io/'
  email: 'therage.kevin+professionnalblog[at]gmail.com'
  title: 'Symfony Lead Developer (Symfony 7 Certified Expert)'
  bio: 'Passionate developer specialized in PHP/Symfony, sharing his knowledge through tutorials and technical articles.'

image: bannier.png

taxonomies:
  tags: tag

metatags:
  data: true

static:
  exclude:
    - "*.md"
    - "*.yml"
    - "*.yaml"

output:
  dir: "_site"
  filename: "index"
  format: 'html'
  pretty: true
  permalink: ':slug/'
  rss: feed.xml
  sitemap: sitemap.xml
  postprocessors:
    BootstrapAlerts: Cecil\Renderer\PostProcessor\BootstrapAlerts
  formats:
    - name: rss
      mediatype: application/rss+xml
      filename: feed
      extension: xml
    - name: atom
      mediatype: application/atom+xml
      filename: atom
      extension: xml
    - name: json
      mediatype: application/json
      filename: feed
      extension: json
    - name: md
      mediatype: text/markdown
      filename: feed
      extension: md
    - name: llms
      mediatype: text/plain
      filename: llms
      extension: txt
  pagetypeformats:
    homepage: [html, rss, atom, json, md, llms]
    section: [html, rss, atom, json, md, llms]
    page: [html, md]

sitemap:
  enabled: true
  exclude: ['404']

# Optimisation des assets
optimize:
  enabled: true

  # Minification HTML
  html:
    enabled: true
    minify: true

  # Minification CSS
  css:
    enabled: true
    minify: true

  # Minification JavaScript
  js:
    enabled: true
    minify: true

  # Optimisation des images
  images:
    enabled: true
    webp: true

cache:
  enabled: true
  dir: ".cache"

# Disable pagination - show all posts on one page
pages:
  pagination: false
  sections:
    nested: true
  body:
    highlight: true
    images:
      formats: ['webp']
      resize: 800
      responsive: true
      lazy: true
      decoding: true
      caption: true
      placeholder: 'lqip'
      class: 'img-fluid rounded mx-auto d-block'

language: 'en'
languages:
  - code: en
    name: English
    locale: en_US
  - code: fr
    name: Français
    locale: fr_FR
    config:
      taxonomies:
        tags: tag
      menus:
        main:
          - id: 'index'
            name: 'Accueil'
            url: '/'
            weight: 10
          - id: 'blog'
            name: 'Blog'
            url: '/blog/'
            weight: 20
          - id: 'tags'
            name: 'Étiquettes'
            url: '/tags/'
            weight: 30

social:
  twitter:
    name: "X/Twitter"
    icon: "fa-brands fa-x-twitter"
    url: "https://x.com/KevinTherage"
    site: KevinTherage
    creator: KevinTherage
  mastodon:
    name: "Mastodon"
    icon: "fa-brands fa-mastodon"
    url: "https://mastodon.social/@ktherage"
    creator: ktherage
  bluesky:
    name: "Bluesky"
    icon: "fa-brands fa-bluesky"
    url: "https://bsky.app/profile/ktherage.bsky.social"
  linkedin:
    name: "LinkedIn"
    icon: "fa-brands fa-linkedin-in"
    url: "https://www.linkedin.com/in/kevin-therage"
  medium:
    name: "Medium"
    icon: "fa-brands fa-medium"
    url: "https://medium.com/@therage.kevin"
  devto:
    name: "Dev.to"
    icon: "fa-brands fa-dev"
    url: "https://dev.to/ktherage"
  github:
    name: "Github"
    icon: "fa-brands fa-github"
    url: "https://github.com/ktherage"
  symfony:
    name: "Symfony connect"
    icon: "fa-brands fa-symfony"
    url: "https://connect.symfony.com/profile/kevin_therage"
