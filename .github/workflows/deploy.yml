name: Deploy Cecil site to GitHub Pages

env:
  CECIL_VERSION: '9.11.0'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the refreshed OSS contributions cache
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json, pdo, :redis

      - name: Install Cecil
        run: |
          curl -fsSL -o cecil.phar "https://github.com/Cecilapp/Cecil/releases/download/$CECIL_VERSION/cecil.phar"
          chmod +x cecil.phar
          sudo mv cecil.phar /usr/local/bin/cecil

      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Build site
        env:
          # A fresh checkout resets the cache file mtime: always refresh instead of
          # trusting the committed cache, which is the fallback for local builds.
          OSS_REFRESH: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cecil build --verbose

      - name: Commit refreshed OSS contributions cache
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- data/oss-contributions.yaml; then
            echo "No change."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/oss-contributions.yaml
          git commit -m 'chore(open-source): refresh contributions cache'
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
